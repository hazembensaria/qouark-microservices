<table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0;padding:24px 0;background-color:#f4f6fb;font-family:Arial,Helvetica,sans-serif;">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:28px 24px;">

                <tr>
                    <td style="font-size:22px;font-weight:700;color:#111827;padding-bottom:12px;">
                        Folder Shared With You 📁
                    </td>
                </tr>

                <tr>
                    <td style="font-size:15px;line-height:1.6;color:#374151;padding-bottom:16px;">
                        Hello <strong th:text="${name}">User</strong>,
                    </td>
                </tr>

                <tr>
                    <td style="font-size:15px;line-height:1.6;color:#374151;padding-bottom:16px;">
                        A folder has been shared with you in your workspace.
                    </td>
                </tr>

                <tr>
                    <td style="font-size:15px;line-height:1.6;color:#374151;padding-bottom:20px;">
                        You can now access it from your dashboard and collaborate with your team.
                    </td>
                </tr>

                <tr>
                    <td style="font-size:12px;color:#9ca3af;text-align:center;padding-top:8px;">
                        If you were not expecting this, please ignore this email or contact support.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
